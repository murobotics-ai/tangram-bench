[project]
name = "tangram-bench"
version = "0.1.0"
description = "A small, readable Tangram manipulation benchmark for MuJoCo and MuJoCo Warp."
requires-python = ">=3.12"
dependencies = ["mujoco>=3.6,<4", "numpy>=2,<3", "shapely>=2,<3"]

[project.optional-dependencies]
warp = ["mujoco-warp>=3.0"]
dev = ["pytest>=8", "pillow>=11", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
